name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Every version reports, so one broken runtime does not hide the others.
      fail-fast: false
      matrix:
        # The low end is the exact floor declared in package.json engines, so the
        # claim is tested rather than asserted. It is a plain 20.0.0 now: the
        # runtime has no dependency that has to be `require`d across the ESM
        # boundary, so the old 20.19 / 22.12 patch floors (the releases that first
        # carried `require(esm)`, which node-fetch v3 needed) no longer apply.
        node-version: ['20.0', '22', '24']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci

      # `npm test` also builds via the pretest hook. Building explicitly first
      # keeps a compile error reported as a build failure, not a test failure.
      - run: npm run build

      - run: npm test
