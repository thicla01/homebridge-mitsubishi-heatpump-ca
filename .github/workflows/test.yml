name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Every version reports, so one broken runtime does not hide the others.
      fail-fast: false
      matrix:
        # The low end is the exact floor declared in package.json engines, so the
        # claim is tested rather than asserted. It is 22.12 since 2.3.13: that is
        # the floor of Homebridge 2.5.0 and hap-nodejs 2.3.0, which the suite runs
        # against (`^22.12.0 || ^24 || ^26`), and Node 20 reached end of life in
        # April 2026. The plugin's own runtime needs nothing that new — it has no
        # dependency to `require` across the ESM boundary — the test harness does.
        node-version: ['22.12', '24', '26']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci

      # `npm test` also builds via the pretest hook. Building explicitly first
      # keeps a compile error reported as a build failure, not a test failure.
      - run: npm run build

      - run: npm test
