name: Publish to npm

on:
  release:
    types: [published]
  # Manual trigger for validating the publish path (e.g. re-running against an
  # already-published version: OIDC auth succeeds, npm then rejects the duplicate).
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v7

      # NOTE: do NOT set registry-url / NODE_AUTH_TOKEN here. setup-node writes an
      # .npmrc that expects a token and that interferes with OIDC trusted publishing.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Trusted publishing requires npm CLI >= 11.5.1 (newer than what ships with Node).
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      # A release tagged vX.Y.Z must publish exactly X.Y.Z. Nothing else in this job
      # reads the tag: every step below takes the version from package.json at the
      # tagged commit, so a forgotten bump would quietly republish the previous
      # version — and if that version still carried a prerelease suffix it would go
      # to `beta` while the job stayed green. The tag arrives through env rather
      # than an inline expression so its contents cannot be read as shell.
      - name: Release tag must match package.json
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json version $VERSION" >&2
            exit 1
          fi
          echo "Tag $TAG matches package.json ($VERSION)."

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Makes the job idempotent. npm rejects a duplicate version with a hard error, so
      # without this any release event for a version already on the registry goes red —
      # including backfilling a GitHub release for an older tag, which the "a release for
      # every version" convention asks for. Skipping is the honest outcome there: the
      # version is published, nothing is left to do.
      - name: Skip if this version is already published
        id: check
        run: |
          # Read the name from package.json rather than hardcoding it: this guard
          # silently never fired after the fork was renamed, because it was still
          # asking the registry about upstream's package.
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$VERSION is already on npm; nothing to publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # Auth is handled automatically via OIDC because a trusted publisher is
      # configured for this package on npmjs.com (no NPM_TOKEN secret needed).
      # A version carrying a prerelease suffix (e.g. 2.3.2-beta.1) is published under
      # the `beta` dist-tag, never `latest`: `npm install <pkg>` must not resolve to
      # it, and the Homebridge UI installs `latest`. A plain release version (2.3.1
      # and up) publishes as usual and takes `latest`. The `-ca.N` numbering this
      # branch was written for ended at 2.3.0-ca.15; the branch stays because the
      # next prerelease, whatever it is called, still must not take `latest`.
      - name: Publish to npm
        if: steps.check.outputs.published == 'false'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            echo "$VERSION is a prerelease; publishing under the 'beta' tag."
            npm publish --provenance --access public --tag beta
          else
            npm publish --provenance --access public
          fi
